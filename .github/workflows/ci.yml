name: macOS validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/verify_ecosystem_dependency.py
      - run: python3 scripts/verify_localization_acceptance.py --ares-dir . --kit-dir Packages/EcosystemKit --require-reviewed-boundaries --output localization-acceptance.json
      - run: swift test
      - run: swift test --package-path Packages/EcosystemKit
      - run: swift build -c release
      - run: scripts/package_app.zsh
        env:
          ECOSYSTEM_SKIP_LSREGISTER: '1'
          ECOSYSTEM_APP_VERSION: '0.37.0'
