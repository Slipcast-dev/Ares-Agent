name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify vendored package
        run: python3 scripts/verify_snapshot.py
      - name: Build
        run: swift build
      - name: Agent tests
        run: swift test
      - name: Shared package tests
        run: swift test --package-path Packages/EcosystemKit
